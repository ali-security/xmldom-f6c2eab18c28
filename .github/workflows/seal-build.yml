# Build-and-pack only: the test suite runs on Travis (.travis.yml -> npm test
# -> t/test -> t/vows). This workflow reproduces the WebJars-NPM jar
# org.webjars.npm:xmldom:0.1.31, which is the npm tarball re-rooted under
# META-INF/resources/webjars/xmldom/0.1.31/ plus the two descriptors the
# WebJar Sync tool writes, zipped without a MANIFEST.MF.
name: seal-build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # npm 6 (Node 12) matches the npm the 0.1.31 tarball was published with:
      # it always includes `changelog` even though .npmignore lists it.
      - uses: actions/setup-node@v4
        with:
          node-version: '12'

      - name: npm pack
        run: |
          set -eu
          # The added workflow must not end up in the tarball.
          rm -rf .github
          npm pack
          ls -l xmldom-*.tgz

      - name: Assemble WebJar
        run: |
          set -eu
          NAME=xmldom
          VER=$(node -p "require('./package.json').version")
          TGZ=$NAME-$VER.tgz
          WJ=META-INF/resources/webjars/$NAME/$VER
          MV=META-INF/maven/org.webjars.npm/$NAME
          rm -rf stage jarroot webjar-out
          mkdir -p stage jarroot/$WJ jarroot/$MV webjar-out
          tar xzf "$TGZ" -C stage
          cp -a stage/package/. jarroot/$WJ/

          # pom.xml as published by WebJar Sync (1660 bytes, ends with a
          # newline). Lines holding only spaces are written with a `~`
          # sentinel, stripped by sed, so no tooling can eat the whitespace.
          cat > jarroot/$MV/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/maven-v4_0_0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <packaging>jar</packaging>
              <groupId>org.webjars.npm</groupId>
              <artifactId>xmldom</artifactId>
              <version>0.1.31</version>
              <name>xmldom</name>
              <description>WebJar for xmldom</description>
              <url>https://www.webjars.org</url>

              <properties>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <scm>
                  <url>https://github.com/xmldom/xmldom</url>
                  <connection>https://github.com/xmldom/xmldom.git</connection>
                  <developerConnection>https://github.com/xmldom/xmldom.git</developerConnection>
                  <tag>v0.1.31</tag>
              </scm>

              <developers>
                  <developer>
                      <id>webjars</id>
                      <url>https://www.webjars.org</url>
                  </developer>
              </developers>

              <licenses>
                  ~
                  <license>
                      <name>LGPL-2.0</name>
                      <url>https://spdx.org/licenses/LGPL-2.0#licenseText</url>
                      <distribution>repo</distribution>
                  </license>
                  ~
                  <license>
                      <name>MIT</name>
                      <url>https://spdx.org/licenses/MIT#licenseText</url>
                      <distribution>repo</distribution>
                  </license>
                  ~
              </licenses>

              ~
              <issueManagement>
                  <url>https://github.com/xmldom/xmldom/issues</url>
              </issueManagement>
              ~

              <dependencies>
                  ~
                  ~
              </dependencies>

          </project>
          EOF
          sed -i 's/~$//' jarroot/$MV/pom.xml
          # pom.properties: leading newline, no trailing newline, 7 trailing spaces.
          printf '\n#Generated by WebJar Sync\nversion=%s\ngroupId=org.webjars.npm\nartifactId=%s\n       ' "$VER" "$NAME" > jarroot/$MV/pom.properties
          echo "9bc1b2630b1bf36c9adec6b0b8b7b1c0  jarroot/$MV/pom.xml" | md5sum -c -
          test "$(stat -c%s jarroot/$MV/pom.properties)" -eq 91

          JAR=$PWD/webjar-out/$NAME-$VER.jar
          cd jarroot
          # Exactly five directory entries, then the files with -D (no more
          # directory entries), in tarball order.
          zip -X -q "$JAR" META-INF/ META-INF/resources/ META-INF/resources/webjars/ \
            META-INF/resources/webjars/$NAME/ META-INF/resources/webjars/$NAME/$VER/
          {
            echo "$MV/pom.xml"
            echo "$MV/pom.properties"
            tar tzf "../$TGZ" | grep -v '/$' | sed "s#^package/#$WJ/#"
          } | zip -X -D -q "$JAR" -@
          cd ..
          files=$(tar tzf "$TGZ" | grep -vc '/$')
          entries=$(unzip -Z1 "$JAR" | wc -l)
          echo "tarball files: $files, jar entries: $entries"
          test "$entries" -eq $((files + 7))
          ! unzip -Z1 "$JAR" | grep -q MANIFEST.MF
          unzip -Zl "$JAR"

      - uses: actions/upload-artifact@v4
        with:
          name: xmldom-webjar
          path: webjar-out/xmldom-*.jar
          if-no-files-found: error
